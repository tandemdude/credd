syntax = "proto3";

package credd.profiles.v1;

// VarKind is detected by the server when a var is set: a value that is a
// supported secret reference (e.g. op://...), or a template containing one,
// is a secret; anything else is a plain value used verbatim.
enum VarKind {
  VAR_KIND_UNSPECIFIED = 0;
  VAR_KIND_PLAIN = 1;
  VAR_KIND_SECRET = 2;
}

message ProfileVar {
  string name = 1;
  string value = 2;
  VarKind kind = 3;
}

message Profile {
  string name = 1;
  repeated ProfileVar vars = 2;
  string description = 3;
}

// ProfileSummary is a profile without its vars.
message ProfileSummary {
  string name = 1;
  string description = 2;
}

message CreateProfileRequest {
  string name = 1;
  string description = 2;
}

message CreateProfileResponse {}

message ListProfilesRequest {}

message ListProfilesResponse {
  reserved 1;
  reserved "names";
  repeated ProfileSummary profiles = 2;
}

message GetProfileRequest {
  string name = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message SetProfileVarRequest {
  string profile = 1;
  string name = 2;
  string value = 3;
}

message SetProfileVarResponse {
  ProfileVar var = 1;
}

message UnsetProfileVarRequest {
  string profile = 1;
  string name = 2;
}

message UnsetProfileVarResponse {}

message SetProfileDescriptionRequest {
  string name = 1;
  string description = 2;
}

message SetProfileDescriptionResponse {}

// ImportProfileRequest creates a profile, with all of its vars, in one atomic
// operation. Var kinds in the request are ignored and re-detected by the server.
message ImportProfileRequest {
  Profile profile = 1;
  // Replace any existing profile with the same name instead of failing with
  // ALREADY_EXISTS.
  bool overwrite = 2;
}

message ImportProfileResponse {
  Profile profile = 1;
}

message DeleteProfileRequest {
  string name = 1;
}

message DeleteProfileResponse {}

service Profiles {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);

  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  rpc SetProfileDescription(SetProfileDescriptionRequest) returns (SetProfileDescriptionResponse);

  rpc SetProfileVar(SetProfileVarRequest) returns (SetProfileVarResponse);
  rpc UnsetProfileVar(UnsetProfileVarRequest) returns (UnsetProfileVarResponse);

  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);

  rpc ImportProfile(ImportProfileRequest) returns (ImportProfileResponse);
}
